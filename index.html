<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedagogía de la Conciencia App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandPrimary: '#1e3a8a',
            brandAccent: '#0d9488',
            brandBg: '#f8fafc'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brandBg text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-brandPrimary text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Pedagogía de la Conciencia</h1>
      <span class="text-xs bg-brandAccent px-2.5 py-1 rounded-full uppercase font-semibold">16 Capítulos</span>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">

    <!-- Selecciones -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label for="chapterSelect" class="block text-sm font-semibold text-slate-700 mb-1">1. Seleccionar Capítulo:</label>
        <select id="chapterSelect" onchange="onChapterChange()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brandAccent focus:outline-none bg-white text-sm">
          <!-- Opciones de Capítulos generadas dinámicamente -->
        </select>
      </div>

      <div>
        <label for="rubricSelect" class="block text-sm font-semibold text-slate-700 mb-1">2. Seleccionar Actividad / Rúbrica:</label>
        <select id="rubricSelect" onchange="loadRubricCriteria()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brandAccent focus:outline-none bg-white text-sm">
          <!-- Rúbricas dinámicas -->
        </select>
      </div>
    </section>

    <!-- Evaluador de Rúbrica -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="border-b border-slate-100 pb-3">
        <h2 id="rubricTitle" class="text-lg font-bold text-brandPrimary">Rúbrica de Evaluación</h2>
        <p class="text-xs text-slate-500">Asigna la calificación de 1 a 5 según el cumplimiento del logro especificado.</p>
      </div>

      <form id="rubricForm" class="space-y-4">
        <div id="criteriaContainer" class="space-y-4">
          <!-- Criterios dinámicos -->
        </div>

        <button type="button" onclick="calculateScore()" class="w-full bg-brandAccent hover:bg-teal-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-150">
          Calcular y Registrar Evaluación
        </button>
      </form>

      <!-- Resultado de Evaluación -->
      <div id="evaluationResult" class="hidden mt-4 p-4 rounded-lg border"></div>
    </section>

  </main>

  <!-- Carga de la Base de Datos Externa -->
  <script src="rubricas.js"></script>

  <!-- Lógica de Control de la App -->
  <script>
    function initApp() {
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '';
      
      for (const capId in appData) {
        chapterSelect.innerHTML += `<option value="${capId}">${appData[capId].title}</option>`;
      }
      onChapterChange();
    }

    function onChapterChange() {
      const capId = document.getElementById('chapterSelect').value;
      const rubricSelect = document.getElementById('rubricSelect');
      rubricSelect.innerHTML = '';

      if (appData[capId]) {
        appData[capId].rubrics.forEach((r, idx) => {
          rubricSelect.innerHTML += `<option value="${idx}">${r.title}</option>`;
        });
      }
      loadRubricCriteria();
    }

    function loadRubricCriteria() {
      const capId = document.getElementById('chapterSelect').value;
      const rubIdx = document.getElementById('rubricSelect').value;
      
      if (!appData[capId] || !appData[capId].rubrics[rubIdx]) return;

      const rubric = appData[capId].rubrics[rubIdx];
      document.getElementById('rubricTitle').innerText = rubric.title;

      const container = document.getElementById('criteriaContainer');
      container.innerHTML = '';

      rubric.criteria.forEach((c, index) => {
        const itemHtml = `
          <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-800 text-sm">${c.name} (${c.weight * 100}%)</span>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed italic bg-white p-2 rounded border border-slate-100">${c.desc}</p>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Calificación (Nivel de Logro):</label>
              <select id="score_${index}" class="w-full p-2 border border-slate-300 rounded bg-white text-sm">
                <option value="5">5 - Nivel Excelente / Logro Destacado</option>
                <option value="4">4 - Nivel Satisfactorio / Logro Alto</option>
                <option value="3">3 - Nivel Aceptable / Logro Medio</option>
                <option value="2">2 - Nivel En Desarrollo / Logro Bajo</option>
                <option value="1">1 - Nivel Inicial / Muy Bajo</option>
              </select>
            </div>
          </div>
        `;
        container.innerHTML += itemHtml;
      });

      document.getElementById('evaluationResult').classList.add('hidden');
    }

    function calculateScore() {
      const capId = document.getElementById('chapterSelect').value;
      const rubIdx = document.getElementById('rubricSelect').value;
      const rubric = appData[capId].rubrics[rubIdx];

      let totalScore = 0;
      rubric.criteria.forEach((c, index) => {
        const val = parseFloat(document.getElementById(`score_${index}`).value);
        totalScore += val * c.weight;
      });

      const resultDiv = document.getElementById('evaluationResult');
      resultDiv.classList.remove('hidden');

      let statusText = "";
      let styleClass = "";

      if (totalScore >= 4.2) {
        styleClass = "bg-green-50 border-green-300 text-green-800";
        statusText = "Nivel de Logro Excelente (Comprensión Consolidada)";
      } else if (totalScore >= 3.0) {
        styleClass = "bg-amber-50 border-amber-300 text-amber-800";
        statusText = "Nivel de Logro Satisfactorio (En Proceso de Aprendizaje)";
      } else {
        styleClass = "bg-red-50 border-red-300 text-red-800";
        statusText = "Requiere Profundización y Revisión del Capítulo";
      }

      resultDiv.className = `mt-4 p-4 rounded-lg border ${styleClass}`;
      resultDiv.innerHTML = `
        <h3 class="font-bold text-base">Puntaje Ponderado: ${totalScore.toFixed(2)} / 5.00</h3>
        <p class="text-sm mt-1"><strong>Resultado:</strong> ${statusText}</p>
      `;
    }

    window.onload = initApp;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
